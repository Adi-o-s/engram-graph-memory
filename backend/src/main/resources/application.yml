spring:
  application:
    name: memora
  datasource:
    url: ${MEMORA_DB_URL:jdbc:postgresql://localhost:5432/memora}
    username: ${MEMORA_DB_USER:memora}
    password: ${MEMORA_DB_PASSWORD:memora}
    hikari:
      maximum-pool-size: ${MEMORA_DB_POOL_SIZE:20}
      minimum-idle: 2
      connection-timeout: 5000
      pool-name: memora-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  threads:
    virtual:
      enabled: false

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never

memora:
  security:
    # Leave empty for local development: a random secret is generated at startup (tokens
    # then stop working after a restart). Set MEMORA_JWT_SECRET (32+ chars) to keep them.
    jwt-secret: ${MEMORA_JWT_SECRET:}
    token-ttl: ${MEMORA_TOKEN_TTL:PT12H}
    cors-origins: ${MEMORA_CORS_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000}
  seed:
    enabled: ${MEMORA_SEED_DEMO_DATA:true}
    demo-password: ${MEMORA_DEMO_PASSWORD:memora-demo}
  handoff:
    lease-seconds: ${MEMORA_HANDOFF_LEASE_SECONDS:300}
    recovery-interval-ms: ${MEMORA_HANDOFF_RECOVERY_INTERVAL_MS:30000}
  context:
    default-max-chars: 4000
    default-max-memories: 12
    default-max-messages: 10
  lab:
    max-threads: 64
    max-operations: 20000
  workflow:
    # Database-backed scheduler: claims READY steps with SELECT ... FOR UPDATE SKIP LOCKED.
    scheduler-enabled: ${MEMORA_WORKFLOW_SCHEDULER_ENABLED:true}
    workers: ${MEMORA_WORKFLOW_WORKERS:4}
    poll-interval-ms: ${MEMORA_WORKFLOW_POLL_INTERVAL_MS:400}
    recovery-interval-ms: 5000
    lease-grace-seconds: 30
    # Requeue steps left RUNNING by a previous process at startup. Correct for one backend instance;
    # set to false when running several instances (lease expiry still recovers them).
    recover-on-startup: ${MEMORA_WORKFLOW_RECOVER_ON_STARTUP:true}
    max-pacing-ms: 5000
  workspace:
    # Optional: a directory agents may read with workspace.* tools (read-only). Empty disables those tools.
    root: ${MEMORA_WORKSPACE_ROOT:}
    command-timeout-seconds: 120
    # Allow-listed commands for command.run, e.g. commands.unit-tests: ["./mvnw", "-q", "test"]. None by default.

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] [%X{tenantId:-}] %logger{36} - %msg%n"
  level:
    org.hibernate.SQL: WARN
