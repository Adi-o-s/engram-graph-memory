# Memora: PostgreSQL (system of record) + FalkorDB (memory graph) + Spring Boot API + dashboard.
# Everything runs locally; no API keys or cloud accounts.
#   cp .env.example .env   # then set MEMORA_JWT_SECRET and the passwords
#   docker compose up --build
# Dashboard: http://localhost:3000   API: http://localhost:8080   Swagger UI: http://localhost:8080/swagger-ui.html
# FalkorDB Browser: http://localhost:3001 (connect to host "falkordb" or "localhost", port 6379)
name: memora

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      MEMORA_DB_NAME: ${MEMORA_DB_NAME:-memora}
      MEMORA_DB_USER: ${MEMORA_DB_USER:-memora}
      MEMORA_DB_PASSWORD: ${MEMORA_DB_PASSWORD:?set MEMORA_DB_PASSWORD in .env}
    volumes:
      - memora-pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "${MEMORA_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${MEMORA_DB_NAME:-memora}"]
      interval: 3s
      timeout: 3s
      retries: 30

  falkordb:
    # Pinned: the Cypher in docs/GRAPH_QUERIES.md was verified against this version.
    image: falkordb/falkordb:v4.14.6
    environment:
      # Append-only file on top of RDB snapshots, so the graph survives restarts (remember across sessions).
      REDIS_ARGS: ${MEMORA_FALKORDB_REDIS_ARGS:---appendonly yes}
    volumes:
      - memora-falkordb:/var/lib/falkordb/data
    ports:
      - "${MEMORA_FALKORDB_PORT:-6379}:6379"
      # The image serves the FalkorDB Browser on container port 3000; the dashboard already uses host 3000.
      - "${MEMORA_FALKORDB_BROWSER_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      falkordb:
        condition: service_healthy
    environment:
      MEMORA_FALKORDB_HOST: falkordb
      MEMORA_FALKORDB_PORT: 6379
      MEMORA_FALKORDB_PASSWORD: ${MEMORA_FALKORDB_PASSWORD:-}
      MEMORA_CONTEXT_RETRIEVAL: ${MEMORA_CONTEXT_RETRIEVAL:-graph}
      MEMORA_DB_URL: jdbc:postgresql://postgres:5432/${MEMORA_DB_NAME:-memora}
      MEMORA_DB_USER: ${MEMORA_DB_USER:-memora}
      MEMORA_DB_PASSWORD: ${MEMORA_DB_PASSWORD}
      MEMORA_JWT_SECRET: ${MEMORA_JWT_SECRET:?set MEMORA_JWT_SECRET in .env (32+ random characters)}
      MEMORA_SEED_DEMO_DATA: ${MEMORA_SEED_DEMO_DATA:-true}
      MEMORA_DEMO_PASSWORD: ${MEMORA_DEMO_PASSWORD:-memora-demo}
      MEMORA_CORS_ORIGINS: ${MEMORA_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "${MEMORA_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${MEMORA_UI_PORT:-3000}:80"

volumes:
  memora-pgdata:
  memora-falkordb:
